name: Checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux Qt and audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libportaudio2 gdb
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q client server shared tools tests
      - run: python tools/check.py
      - name: Windows launcher and two-client TLS preview
        if: runner.os == 'Windows'
        run: '& ".\Просмотр Nodys.cmd" --smoke-seconds 8'
      - name: Two-client TLS preview smoke
        if: runner.os != 'Windows'
        run: python tools/preview.py --tls --smoke-seconds 8
      - name: Headless UI workflows with synthetic voice
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: python tools/ui_review.py --synthetic-voice --output work/ui-review
      - name: Headless UI workflows with native crash diagnostics
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: gdb --batch --return-child-result -ex "set pagination off" -ex run -ex "thread apply all bt" --args python tools/ui_review.py --synthetic-voice --relogin-cycles 5 --output work/ui-review
      - name: Save UI review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-${{ matrix.os }}
          path: work/ui-review
          retention-days: 7
      - name: Install analysis tools
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-checks.txt
      - name: Undefined names and security scan
        if: runner.os == 'Linux'
        run: |
          python -m ruff check client server shared tools --select F821,F822,F823
          python -m bandit -r client server shared -ll
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
